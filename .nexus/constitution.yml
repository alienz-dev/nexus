gates:
  open:
    transitions: [specced]
    requires: []
  specced:
    transitions: [tests_written]
    requires: [spec_exists]
  tests_written:
    transitions: [red_verified]
    requires: [test_file_exists]
  red_verified:
    transitions: [implementing]
    requires: [tests_fail]
  implementing:
    transitions: [green]
    requires: []
  green:
    transitions: [reviewing]
    requires: [tests_pass]
  reviewing:
    transitions: [closed]
    requires: [review_approved]
  closed:
    transitions: []
    requires: []
